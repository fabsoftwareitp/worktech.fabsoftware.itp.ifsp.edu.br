<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <title>Início - XI Worktech</title>
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&family=Share+Tech+Mono&family=Tektur:wght@500;600;700&display=swap"
    />
    <link href="css/material.icons.css" rel="stylesheet" />
    <link rel="stylesheet" href="css/all.min.css" />
    <link rel="stylesheet" href="css/style.css" />

    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="icon" sizes="192x192" href="img/logo_worktech.png" />
    <meta name="theme-color" content="#1b4332" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  </head>

  <body class="dark">
    <div class="header">
      <div class="header-background"></div>
      <!-- Trilhas de circuito no estilo da logo, geradas por circuit-board.js -->
      <svg
        class="header-circuits"
        viewBox="0 0 1440 900"
        preserveAspectRatio="xMidYMid slice"
        aria-hidden="true"
        focusable="false"
      ></svg>
      <div w3-include-html="view/components/navbar.html"></div>
      <div w3-include-html="view/components/header.html"></div>
    </div>

    <div w3-include-html="view/components/programacao.html"></div>
    <div w3-include-html="view/components/inscricoes.html"></div>
    <div w3-include-html="view/components/local.html"></div>
    <div w3-include-html="view/components/footer.html"></div>
    <div w3-include-html="view/components/lamp-button.html"></div>

    <!-- SCRIPTS -->
    <script src="js/jquery.js"></script>
    <script src="js/materialize.min.js"></script>

    <!-- GSAP Animation Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>

    <!-- Application Modules -->
    <script src="js/modules/html-include.js"></script>
    <script src="js/modules/theme-toggle.js"></script>
    <script src="js/modules/timeline.js"></script>
    <script src="js/modules/day-carousel.js"></script>
    <script src="js/modules/smooth-scroll.js"></script>
    <script src="js/modules/poly-mesh.js"></script>
    <script src="js/modules/circuit-board.js"></script>
    <script src="js/modules/data-background.js"></script>
    <script src="js/modules/gsap-animations.js"></script>

    <!-- Main Application -->
    <script src="js/main.js"></script>
  </body>
</html>
