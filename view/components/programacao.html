<div id="programacao" class="programacao">
  <div class="container-fluid position-relative mt-5">
    <!-- Fundo de dados (data-background.js): fluxo de bytes nas laterais e uma
         rede de nos por onde os bytes viajam como pacotes. O canvas fica
         grudado na tela enquanto a secao passa, entao nao depende da altura -->
    <div
      class="data-bg"
      aria-hidden="true"
      data-content="#programacao .schedule"
      data-avoid="#svg-programacao-triangles"
    >
      <canvas class="data-bg__canvas"></canvas>
    </div>

    <!-- Montanha em malha poligonal, desenhada por poly-mesh.js -->
    <canvas
      id="svg-programacao-triangles"
      class="mesh-mountain"
      data-mesh="right"
      aria-hidden="true"
      style="top: -100px; right: 0; width: 750px; height: 800px; z-index: -1"
    ></canvas>

    <div class="programacao-header" style="position: relative; z-index: 10">
      <h1 class="uppercase f-700 center section-title" style="margin-bottom: 0.5rem">
        Programação
      </h1>
      <p class="center programacao-subtitle">
        Confira a programação completa do evento
      </p>
    </div>

    <!-- Carrossel de dias: abas acessiveis, com rolagem por toque/setas -->
    <div class="day-carousel mt-3 mb-5" data-day-carousel>
      <button
        type="button"
        class="day-carousel__nav day-carousel__nav--prev"
        aria-label="Ver dias anteriores"
        data-dir="-1"
      >
        <i class="material-icons" aria-hidden="true">chevron_left</i>
      </button>
      <div class="day-carousel__viewport">
        <div class="timeline-tabs day-carousel__track" role="tablist" aria-label="Dias do evento">
          <a
            href="#26-de-outubro"
            id="tab-26-de-outubro"
            class="timeline-activation day-card"
            role="tab"
            aria-controls="26-de-outubro"
            aria-selected="false"
            aria-label="Segunda-feira, 26 de outubro"
          >
            <span class="tab-weekday">Seg</span>
            <span class="tab-label">26</span>
            <span class="tab-date">out</span>
          </a>
          <a
            href="#27-de-outubro"
            id="tab-27-de-outubro"
            class="timeline-activation day-card"
            role="tab"
            aria-controls="27-de-outubro"
            aria-selected="false"
            aria-label="Terça-feira, 27 de outubro"
          >
            <span class="tab-weekday">Ter</span>
            <span class="tab-label">27</span>
            <span class="tab-date">out</span>
          </a>
          <a
            href="#28-de-outubro"
            id="tab-28-de-outubro"
            class="timeline-activation day-card"
            role="tab"
            aria-controls="28-de-outubro"
            aria-selected="false"
            aria-label="Quarta-feira, 28 de outubro"
          >
            <span class="tab-weekday">Qua</span>
            <span class="tab-label">28</span>
            <span class="tab-date">out</span>
          </a>
          <a
            href="#29-de-outubro"
            id="tab-29-de-outubro"
            class="timeline-activation day-card"
            role="tab"
            aria-controls="29-de-outubro"
            aria-selected="false"
            aria-label="Quinta-feira, 29 de outubro"
          >
            <span class="tab-weekday">Qui</span>
            <span class="tab-label">29</span>
            <span class="tab-date">out</span>
          </a>
          <a
            href="#30-de-outubro"
            id="tab-30-de-outubro"
            class="timeline-activation day-card"
            role="tab"
            aria-controls="30-de-outubro"
            aria-selected="false"
            aria-label="Sexta-feira, 30 de outubro"
          >
            <span class="tab-weekday">Sex</span>
            <span class="tab-label">30</span>
            <span class="tab-date">out</span>
          </a>
        </div>
      </div>
      <button
        type="button"
        class="day-carousel__nav day-carousel__nav--next"
        aria-label="Ver próximos dias"
        data-dir="1"
      >
        <i class="material-icons" aria-hidden="true">chevron_right</i>
      </button>
    </div>

    <div class="container schedule">
      <div class="row timeline"></div>
    </div>
  </div>
</div>
