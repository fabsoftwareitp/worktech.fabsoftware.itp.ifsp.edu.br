<div id="programacao" class="programacao">
  <div class="container-fluid position-relative mt-5">
    <!-- Fundo em ladrilho: o desenho tem altura fixa (proporcao do viewBox) e
         se repete para baixo (tiled-background.js), entao nao se move quando a
         altura da secao muda na troca de dias -->
    <div class="prog-bg" aria-hidden="true">
      <div class="prog-bg__tile">
        <!-- SVG de fundo com triângulos flutuantes -->
        <svg
          id="svg-programacao-floating"
          class="svg-floating-triangles svg-theme-adaptive"
          viewBox="0 0 1200 800"
          style="
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
          "
        >
          <!-- Triângulos flutuantes serão gerados dinamicamente via JavaScript -->
          <g id="prog-floating-art"></g>
        </svg>

        <svg
          class="svg-decoration-programacao svg-theme-adaptive"
          viewBox="0 0 1200 800"
          style="
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            opacity: 1;
            pointer-events: none;
            z-index: 1;
          "
        >
          <defs>
            <radialGradient id="progOrb1" cx="50%" cy="50%" r="50%">
              <stop offset="0%" stop-color="currentColor" stop-opacity="0.16" />
              <stop offset="100%" stop-color="currentColor" stop-opacity="0" />
            </radialGradient>
            <radialGradient id="progOrb2" cx="50%" cy="50%" r="50%">
              <stop offset="0%" stop-color="currentColor" stop-opacity="0.12" />
              <stop offset="100%" stop-color="currentColor" stop-opacity="0" />
            </radialGradient>
            <linearGradient id="progLineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="currentColor" stop-opacity="0.3" />
              <stop offset="50%" stop-color="currentColor" stop-opacity="0.2" />
              <stop offset="100%" stop-color="currentColor" stop-opacity="0.1" />
            </linearGradient>
          </defs>

          <g id="prog-decoration-art">
            <circle id="progOrb1" cx="200" cy="200" r="150" fill="url(#progOrb1)" />
            <circle id="progOrb2" cx="1000" cy="400" r="180" fill="url(#progOrb2)" />
            <circle id="progOrb3" cx="600" cy="650" r="120" fill="url(#progOrb1)" />

            <g
              id="progLines"
              stroke="url(#progLineGrad)"
              stroke-width="2"
              fill="none"
              opacity="0.6"
            >
              <path id="progLine1" d="M 0,100 Q 300,200 600,100 T 1200,100" />
              <path id="progLine2" d="M 0,300 Q 400,400 800,300 T 1200,300" />
              <path id="progLine3" d="M 0,500 Q 350,600 700,500 T 1200,500" />
            </g>

            <g id="progParticles">
              <circle
                class="prog-particle"
                cx="150"
                cy="150"
                r="3"
                fill="currentColor"
                opacity="0.8"
              />
              <circle
                class="prog-particle"
                cx="350"
                cy="250"
                r="2"
                fill="currentColor"
                opacity="0.7"
              />
              <circle
                class="prog-particle"
                cx="550"
                cy="180"
                r="2.5"
                fill="currentColor"
                opacity="0.8"
              />
              <circle
                class="prog-particle"
                cx="750"
                cy="320"
                r="2"
                fill="currentColor"
                opacity="0.7"
              />
              <circle
                class="prog-particle"
                cx="950"
                cy="220"
                r="3"
                fill="currentColor"
                opacity="0.8"
              />
              <circle
                class="prog-particle"
                cx="450"
                cy="520"
                r="2.5"
                fill="currentColor"
                opacity="0.8"
              />
              <circle
                class="prog-particle"
                cx="850"
                cy="580"
                r="3"
                fill="currentColor"
                opacity="0.8"
              />
            </g>

            <g id="progDots" fill="currentColor" opacity="0.2">
              <circle cx="240" cy="180" r="1.5" />
              <circle cx="420" cy="240" r="1.5" />
              <circle cx="720" cy="280" r="1.5" />
              <circle cx="860" cy="380" r="1.5" />
              <circle cx="340" cy="640" r="1.5" />
              <circle cx="740" cy="720" r="1.5" />
            </g>

            <g
              id="progConnectors"
              stroke="currentColor"
              stroke-width="0.5"
              stroke-dasharray="4,8"
              fill="none"
              opacity="0.12"
            >
              <path d="M 200,200 L 600,650" />
              <path d="M 1000,400 L 600,650" />
            </g>
          </g>
        </svg>
      </div>
    </div>

    <!-- SVG com triângulos animados em formato de montanha -->
    <svg
      id="svg-programacao-triangles"
      class="svg-animated-triangles"
      viewBox="0 0 750 800"
      preserveAspectRatio="none"
      style="
        position: absolute;
        top: -100px;
        right: 0;
        width: 750px;
        height: 800px;
        z-index: -1;
        pointer-events: none;
        opacity: 0.7;
        overflow: visible;
      "
    >
      <!-- Triângulos serão gerados dinamicamente via JavaScript -->
    </svg>

    <div class="programacao-header" style="position: relative; z-index: 10">
      <h1 class="uppercase f-700 center section-title" style="margin-bottom: 0.5rem">
        Programação
      </h1>
      <p class="center programacao-subtitle">
        Confira a programação completa do evento
      </p>
    </div>

    <!-- Carrossel de dias: abas acessiveis, com rolagem por toque/setas -->
    <div class="day-carousel mt-3 mb-5" data-day-carousel>
      <button
        type="button"
        class="day-carousel__nav day-carousel__nav--prev"
        aria-label="Ver dias anteriores"
        data-dir="-1"
      >
        <i class="material-icons" aria-hidden="true">chevron_left</i>
      </button>
      <div class="day-carousel__viewport">
        <div class="timeline-tabs day-carousel__track" role="tablist" aria-label="Dias do evento">
          <a
            href="#26-de-outubro"
            id="tab-26-de-outubro"
            class="timeline-activation day-card"
            role="tab"
            aria-controls="26-de-outubro"
            aria-selected="false"
            aria-label="Segunda-feira, 26 de outubro"
          >
            <span class="tab-weekday">Seg</span>
            <span class="tab-label">26</span>
            <span class="tab-date">out</span>
          </a>
          <a
            href="#27-de-outubro"
            id="tab-27-de-outubro"
            class="timeline-activation day-card"
            role="tab"
            aria-controls="27-de-outubro"
            aria-selected="false"
            aria-label="Terça-feira, 27 de outubro"
          >
            <span class="tab-weekday">Ter</span>
            <span class="tab-label">27</span>
            <span class="tab-date">out</span>
          </a>
          <a
            href="#28-de-outubro"
            id="tab-28-de-outubro"
            class="timeline-activation day-card"
            role="tab"
            aria-controls="28-de-outubro"
            aria-selected="false"
            aria-label="Quarta-feira, 28 de outubro"
          >
            <span class="tab-weekday">Qua</span>
            <span class="tab-label">28</span>
            <span class="tab-date">out</span>
          </a>
          <a
            href="#29-de-outubro"
            id="tab-29-de-outubro"
            class="timeline-activation day-card"
            role="tab"
            aria-controls="29-de-outubro"
            aria-selected="false"
            aria-label="Quinta-feira, 29 de outubro"
          >
            <span class="tab-weekday">Qui</span>
            <span class="tab-label">29</span>
            <span class="tab-date">out</span>
          </a>
          <a
            href="#30-de-outubro"
            id="tab-30-de-outubro"
            class="timeline-activation day-card"
            role="tab"
            aria-controls="30-de-outubro"
            aria-selected="false"
            aria-label="Sexta-feira, 30 de outubro"
          >
            <span class="tab-weekday">Sex</span>
            <span class="tab-label">30</span>
            <span class="tab-date">out</span>
          </a>
        </div>
      </div>
      <button
        type="button"
        class="day-carousel__nav day-carousel__nav--next"
        aria-label="Ver próximos dias"
        data-dir="1"
      >
        <i class="material-icons" aria-hidden="true">chevron_right</i>
      </button>
    </div>

    <div class="container schedule">
      <div class="row timeline"></div>
    </div>
  </div>
</div>
