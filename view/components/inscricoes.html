<div id="inscricoes" class="container-fluid position-relative">

    id="svg-inscricoes-triangles"
    class="mesh-mountain hide-on-med-and-down"
    data-mesh="left"
    aria-hidden="true"
    style="top: -220px; left: 0; width: 690px; height: 800px; z-index: 5"
  ></canvas>
  <!-- Trilhas de circuito no canto direito, geradas por circuit-board.js -->

    class="inscricoes-circuits"
    viewBox="0 0 320 760"
    preserveAspectRatio="xMaxYMid slice"
    aria-hidden="true"
    focusable="false"
  ></svg>
  <div class="row mt-15">
    <div class="col s12 m8 offset-m4 l4 offset-l6 mt-sm-3 mb-sm-5 right-align">

      <h4 class="thin">
        As inscrições garantem a participação e o certificado!
      </h4>
      <a href="#programacao" class="btn-large btn-cta mt-sm-1">
        <i class="material-icons left">person_add</i>Realizar Inscrição
      </a>
    </div>
  </div>
</div>
